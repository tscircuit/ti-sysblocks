<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1905" height="1530" viewBox="0 150 1905 1530" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMin meet">
  <title id="title">Machine vision camera diagram</title>
  <desc id="desc">Vector machine vision camera block diagram. Selectable groups expose their IDs to the containing HTML page.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #101010; }
      .wire { fill: none; stroke: #111; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
      .wire-dash { fill: none; stroke: #111; stroke-width: 2; stroke-dasharray: 14 9; }
      .block { fill: #d9f1f5; stroke: #65b6c2; stroke-width: 1; }
      .plain-block { fill: #fff; stroke: #222; stroke-width: 1.4; }
      .chip { fill: #00869a; }
      .chip-text { fill: #fff; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
      .block-label { font-size: 26px; text-anchor: middle; }
      .annotation { font-size: 24px; text-anchor: middle; }
    </style>
    <marker id="arrow-end" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5 L0,10 Z" fill="#111"/>
    </marker>
    <marker id="arrow-start" markerWidth="12" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L11,5 L0,10 Z" fill="#111"/>
    </marker>
  </defs>

  <rect width="1905" height="1680" fill="#fff"/>
